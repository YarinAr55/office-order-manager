<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מערכת הזמנות ציוד משרדי</title>
  <!-- טעינת Tailwind CSS לעיצוב נקי ויוקרתי -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap');
    body {
      font-family: 'Assistant', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen text-slate-800">

  <!-- כותרת עליונה -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">מערכת הזמנות ציוד משרדי</h1>
        <p class="text-sm text-slate-500">ניהול קטלוג, חיפוש מהיר והפקת הזמנות לאקסל</p>
      </div>
      <!-- המחיר הכולל בראש העמוד - בגדול ובולט -->
      <div class="bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-md flex items-center gap-3">
        <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">סה"כ לתשלום:</span>
        <span id="headerTotalPrice" class="text-2xl font-extrabold text-emerald-400">₪0.00</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- צד שמאל/מרכז: קטלוג וניהול פריטים -->
    <div class="lg:col-span-2 space-y-6">
      
      <!-- פאנל הוספת פריט -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80">
        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <span>➕</span> הוספת פריט חדש לקטלוג
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">שם הפריט</label>
            <input type="text" id="newProductName" placeholder="למשל: דפדפת A4" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">מחיר (₪)</label>
            <input type="number" id="newProductPrice" min="0" step="0.5" placeholder="0.00" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition" />
          </div>
          <div class="flex items-end">
            <button type="button" onclick="addNewProduct()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl text-sm shadow-sm transition active:scale-95 cursor-pointer">
              הוסף לקטלוג
            </button>
          </div>
        </div>
      </div>

      <!-- פאנל חיפוש וקטלוג -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <span>📦</span> קטלוג פריטים
          </h2>
          <!-- תיבת חיפוש -->
          <div class="w-full sm:w-72">
            <input type="text" id="searchInput" oninput="renderCatalog()" placeholder="🔍 חיפוש פריט מהיר..." class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition" />
          </div>
        </div>

        <!-- רשת קטלוג -->
        <div id="catalogGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- הפריטים יטענו דינמית -->
        </div>
      </div>

    </div>

    <!-- צד ימין: עגלת קניות וסיכום הזמנה -->
    <div>
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 sticky top-28">
        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <span>🛒</span> עגלת הזמנות
        </h2>

        <!-- רשימת עגלה -->
        <div id="cartList" class="divide-y divide-slate-100 max-h-[350px] overflow-y-auto mb-6 pr-1">
          <div class="text-center py-8 text-slate-400 text-sm">העגלה ריקה</div>
        </div>

        <!-- סיכום מחיר כולל בגדול ובולט -->
        <div class="bg-slate-900 text-white p-5 rounded-2xl mb-6 shadow-md text-center">
          <div class="text-xs text-slate-400 font-medium mb-1">סה"כ לתשלום להזמנה</div>
          <div id="cartTotalPrice" class="text-3xl font-black text-emerald-400 tracking-tight">₪0.00</div>
        </div>

        <!-- כפתור ייצוא לאקסל -->
        <button type="button" onclick="exportToExcel()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
          <span>📊</span> ייצוא הזמנה לאקסל (ללא מחיר)
        </button>
      </div>
    </div>

  </main>

  <script>
    let products = [
      { id: 1, name: "דפדפת A4", price: 12.5 },
      { id: 2, name: "עט כחול (בודד)", price: 2.0 },
      { id: 3, name: "מרקר צהוב", price: 4.5 }
    ];
    let cart = [];

    // האזנה למקש Enter בשדות הקלט של הוספת מוצר
    window.addEventListener('DOMContentLoaded', () => {
      const nameIn = document.getElementById("newProductName");
      const priceIn = document.getElementById("newProductPrice");

      if (nameIn) {
        nameIn.addEventListener("keypress", function(e) {
          if (e.key === "Enter") addNewProduct();
        });
      }
      if (priceIn) {
        priceIn.addEventListener("keypress", function(e) {
          if (e.key === "Enter") addNewProduct();
        });
      }

      renderCatalog();
      renderCart();
    });

    // הצגת הקטלוג עם סינון חיפוש
    function renderCatalog() {
      const grid = document.getElementById("catalogGrid");
      const searchInput = document.getElementById("searchInput");
      if (!grid) return;

      const searchTerm = searchInput ? searchInput.value.trim().toLowerCase() : "";
      const filteredProducts = products.filter(p => p.name.toLowerCase().includes(searchTerm));

      if (filteredProducts.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 text-sm">לא נמצאו פריטים בקטלוג.</div>`;
        return;
      }

      let html = "";
      for (let i = 0; i < filteredProducts.length; i++) {
        let p = filteredProducts[i];
        html += `
          <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-4 flex flex-col justify-between hover:shadow-md transition">
            <div>
              <div class="flex justify-between items-start gap-2 mb-1">
                <h3 class="font-bold text-slate-800 text-sm">${p.name}</h3>
                <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100">₪${p.price.toFixed(2)}</span>
              </div>
            </div>
            
            <div class="mt-4 pt-3 border-t border-slate-200/60 flex items-center gap-2">
              <input type="number" id="qty-${p.id}" placeholder="כמות" min="1" class="w-20 px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
              <button type="button" onclick="addToCart(${p.id})" class="flex-1 bg-slate-900 hover:bg-blue-600 text-white font-medium py-1.5 px-3 rounded-lg text-xs transition cursor-pointer">הוסף</button>
            </div>

            <div class="flex justify-between items-center mt-3 text-xs">
              <button type="button" onclick="editProduct(${p.id})" class="text-slate-500 hover:text-blue-600 font-medium cursor-pointer">ערוך</button>
              <button type="button" onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-700 font-medium cursor-pointer">מחק</button>
            </div>
          </div>
        `;
      }
      grid.innerHTML = html;
    }

    // הוספת פריט חדש
    function addNewProduct() {
      const nameInput = document.getElementById("newProductName");
      const priceInput = document.getElementById("newProductPrice");

      if (!nameInput || !priceInput) return;

      const name = nameInput.value.trim();
      const price = parseFloat(priceInput.value);

      if (!name) {
        alert("נא להזין שם פריט");
        nameInput.focus();
        return;
      }

      if (isNaN(price) || price < 0) {
        alert("נא להזין מחיר תקין");
        priceInput.focus();
        return;
      }

      const newId = products.length > 0 ? Math.max.apply(null, products.map(p => p.id)) + 1 : 1;
      products.push({ id: newId, name: name, price: price });

      nameInput.value = "";
      priceInput.value = "";
      nameInput.focus();

      renderCatalog();
    }

    // עריכת פריט
    function editProduct(id) {
      const p = products.find(item => item.id === id);
      if (!p) return;

      const newName = prompt("שם חדש לפריט:", p.name);
      if (newName === null) return;

      const newPriceStr = prompt("מחיר חדש (₪):", p.price);
      if (newPriceStr === null) return;

      const newPrice = parseFloat(newPriceStr);
      if (isNaN(newPrice) || newPrice < 0) {
        alert("מחיר שגוי");
        return;
      }

      p.name = newName.trim();
      p.price = newPrice;

      renderCatalog();
      renderCart();
    }

    // מחיקת פריט מהקטלוג
    function deleteProduct(id) {
      products = products.filter(p => p.id !== id);
      cart = cart.filter(item => item.id !== id);
      renderCatalog();
      renderCart();
    }

    // הוספה לעגלה
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      const qtyInput = document.getElementById("qty-" + id);
      const qty = qtyInput ? parseInt(qtyInput.value) : NaN;

      if (isNaN(qty) || qty <= 0) {
        alert("נא להזין כמות תקינה");
        if (qtyInput) qtyInput.focus();
        return;
      }

      const cartItem = cart.find(item => item.id === id);
      if (cartItem) {
        cartItem.quantity += qty;
      } else {
        cart.push({ id: product.id, name: product.name, price: product.price, quantity: qty });
      }

      if (qtyInput) qtyInput.value = "";
      renderCart();
    }

    // עדכון כמויות בעגלה (+ / -)
    function updateCartQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;

      item.quantity += delta;
      if (item.quantity <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      renderCart();
    }

    // מחיקת פריט מהעגלה לחלוטין
    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      renderCart();
    }

    // רינדור עגלה ועדכון המחיר הכולל הבולט
    function renderCart() {
      const cartList = document.getElementById("cartList");
      const cartTotalPrice = document.getElementById("cartTotalPrice");
      const headerTotalPrice = document.getElementById("headerTotalPrice");

      if (!cartList) return;

      let total = 0;

      if (cart.length === 0) {
        cartList.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">העגלה ריקה</div>`;
        if (cartTotalPrice) cartTotalPrice.innerHTML = `₪0.00`;
        if (headerTotalPrice) headerTotalPrice.innerHTML = `₪0.00`;
        return;
      }

      let html = "";
      for (let i = 0; i < cart.length; i++) {
        let item = cart[i];
        const currentProd
