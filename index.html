<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>מערכת הזמנות ציוד משרדי</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      direction: rtl;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1e3a5f);
      color: white;
      padding: 24px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    header p {
      color: #cbd5e1;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .tab {
      border: 0;
      padding: 12px 20px;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .tab.active {
      background: #2563eb;
      color: white;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-bottom: 18px;
      font-size: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      font-family: inherit;
    }

    .btn {
      border: none;
      padding: 11px 17px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .form-actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box {
      margin-bottom: 18px;
    }

    .search-box input {
      max-width: 500px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 13px;
      text-align: right;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #f8fafc;
      font-size: 14px;
    }

    td {
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    .order-product-row {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .summary {
      max-width: 450px;
      margin-right: auto;
      margin-top: 25px;
      background: #f8fafc;
      border-radius: 14px;
      padding: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 16px;
    }

    .summary-total {
      font-size: 21px;
      font-weight: bold;
      color: #166534;
      border-top: 2px solid #d1d5db;
      margin-top: 8px;
      padding-top: 15px;
    }

    .price {
      font-weight: bold;
      color: #166534;
    }

    .badge {
      background: #dbeafe;
      color: #1d4ed8;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      display: inline-block;
    }

    .notice {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 18px;
    }
