<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מערכת הזמנות ציוד משרדי</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap');
    body { font-family: 'Assistant', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen text-slate-800 pb-12">

  <!-- כותרת עליונה -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">מערכת הזמנות ציוד משרדי</h1>
        <p class="text-xs sm:text-sm text-slate-500">ניהול קטלוג, חיפוש מהיר והפקת הזמנות לאקסל</p>
      </div>
      <div class="text-xs font-semibold text-emerald-600 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-lg">
        ✓ חיבור אירועים מאובטח
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8 grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8">
    
    <!-- צד שמאל: קטלוג וניהול פריטים -->
    <div class="lg:col-span-2 space-y-6">
      
      <!-- פאנל הוספת פריט -->
      <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80">
        <h2 class="text-base sm:text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <span>➕</span> הוספת פריט חדש לקטלוג
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">שם הפריט</label>
            <input type="text" id="newProductName" placeholder="למשל: דפדפת A4" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">מחיר (₪)</label>
            <input type="text" inputmode="decimal" id="newProductPrice" placeholder="0.00" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition" />
          </div>
          <div class="flex items-end">
            <!-- ללא onclick ישיר - מחובר מאובטח דרך ה-JS -->
            <button type="button" id="btnAddProduct" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl text-sm shadow-sm transition active:scale-95 cursor-pointer">
              הוסף לקטלוג
            </button>
          </div>
        </div>
      </div>

      <!-- פאנל חיפוש וקטלוג -->
      <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <h2 class="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-2">
            <span>📦</span> קטלוג פריטים
          </h2>
          <div class="w-full sm:w-72">
            <input type="text" id="searchInput" placeholder="🔍 חיפוש פריט מהיר..." class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition" />
          </div>
        </div>

        <div id="catalogGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- הפריטים יטענו דינמית -->
        </div>
      </div>

    </div>

    <!-- צד ימין: עגלת קניות -->
    <div>
      <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80 lg:sticky lg:top-28">
        <h2 class="text-base sm:text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <span>🛒</span> עגלת הזמנות
        </h2>

        <div id="cartList" class="divide-y divide-slate-100 max-h-[350px] overflow-y-auto mb-6 pr-1">
          <div class="text-center py-8 text-slate-400 text-sm">העגלה ריקה</div>
        </div>

        <!-- מחיר כולל יחיד ומרכזי -->
        <div class="bg-slate-900 text-white p-5 rounded-2xl mb-6 shadow-md text-center">
          <div class="text-xs text-slate-400 font-medium mb-1">סה"כ לתשלום להזמנה</div>
          <div id="cartTotalPrice" class="text-3xl font-black text-emerald-400 tracking-tight">₪0.00</div>
        </div>

        <button type="button" id="btnExport" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
          <span>📊</span> ייצוא הזמנה לאקסל (ללא מחיר)
        </button>
      </div>
    </div>

  </main>

  <script>
    let products = [
      { id: 1, name: "דפדפת A4", price: 12.5 },
      { id: 2, name: "עט כחול (בודד)", price: 1.2 },
      { id: 3, name: "מרקר צהוב", price: 4.5 }
    ];
    let cart = [];

    // אתחול האזנה לאירועים ברגע שהעמוד נטען במלואו
    document.addEventListener("DOMContentLoaded", function() {
      const btnAdd = document.getElementById("btnAddProduct");
      const btnExport = document.getElementById("btnExport");
      const searchInput = document.getElementById("searchInput");
      const nameInput = document.getElementById("newProductName");
      const priceInput = document.getElementById("newProductPrice");

      if (btnAdd) {
        btnAdd.addEventListener("click", addNewProduct);
      }

      if (btnExport) {
        btnExport.addEventListener("click", exportToExcel);
      }

      if (searchInput) {
        searchInput.addEventListener("input", renderCatalog);
      }

      // תמיכה בלחיצת Enter להוספה מהירה
      if (nameInput) {
        nameInput.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            addNewProduct();
          }
        });
      }

      if (priceInput) {
        priceInput.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            addNewProduct();
          }
        });
      }

      renderCatalog();
      renderCart();
    });

    function renderCatalog() {
      const grid = document.getElementById("catalogGrid");
      const searchInput = document.getElementById("searchInput");
      if (!grid) return;

      const searchTerm = searchInput ? searchInput.value.trim().toLowerCase() : "";
      const filteredProducts = products.filter(p => p.name.toLowerCase().includes(searchTerm));

      if (filteredProducts.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 text-sm">לא נמצאו פריטים בקטלוג.</div>`;
        return;
      }

      let html = "";
      for (let i = 0; i < filteredProducts.length; i++) {
        let p = filteredProducts[i];
        html += `
          <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-4 flex flex-col justify-between hover:shadow-md transition">
            <div>
              <div class="flex justify-between items-start gap-2 mb-1">
                <h3 class="font-bold text-slate-800 text-sm">${p.name}</h3>
                <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100">₪${p.price.toFixed(2)}</span>
              </div>
            </div>
            
            <div class="mt-4 pt-3 border-t border-slate-200/60 flex items-center gap-2">
              <input type="number" id="qty-${p.id}" placeholder="כמות" min="1" class="w-20 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
              <button type="button" data-add-id="${p.id}" class="btn-add-cart flex-1 bg-slate-900 hover:bg-blue-600 text-white font-medium py-2 px-3 rounded-lg text-xs transition cursor-pointer">הוסף</button>
            </div>

            <div class="flex justify-between items-center mt-3 text-xs">
              <button type="button" data-edit-id="${p.id}" class="btn-edit text-slate-500 hover:text-blue-600 font-medium cursor-pointer p-1">ערוך</button>
              <button type="button" data-delete-id="${p.id}" class="btn-delete text-red-500 hover:text-red-700 font-medium cursor-pointer p-1">מחק</button>
            </div>
          </div>
        `;
      }
      grid.innerHTML = html;

      // חיבור האזנות לכפתורים שנוצרים דינמית בקטלוג
      attachCatalog
